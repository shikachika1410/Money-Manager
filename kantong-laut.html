"wrap\">\n\u003cheader>\u003ch1>🐳 Kantong Laut\u003c/h1>\u003cdiv class=\"sub\">catat uang harian, santai aja 🌊\u003cspan id=\"cs\">\u003c/span>\u003c/div>\u003c/header>\n\u003cdiv class=\"card hide\" id=\"cloudbar\">\u003cdiv id=\"cloudtxt\" style=\"font-size:.88rem;font-weight:700;margin-bottom:8px\">\u003c/div>\u003cbutton class=\"btn i\" id=\"cloudbtn\">Masuk dengan Google\u003c/button>\u003c/div>\n\u003cdiv class=\"card\">\n  \u003cdiv class=\"nav\">\u003cbutton id=\"prev\">‹\u003c/button>\u003cb id=\"ttl\">\u003c/b>\u003cbutton id=\"next\">›\u003c/button>\u003c/div>\n  \u003cdiv class=\"sum\">\n    \u003cdiv>\u003csmall>Pemasukan\u003c/small>\u003cb class=\"inc\" id=\"sI\">\u003c/b>\u003c/div>\n    \u003cdiv>\u003csmall>Pengeluaran\u003c/small>\u003cb class=\"exp\" id=\"sE\">\u003c/b>\u003c/div>\n    \u003cdiv>\u003csmall>Sisa budget\u003c/small>\u003cb id=\"sB\">\u003c/b>\u003c/div>\n  \u003c/div>\n  \u003cdiv id=\"wal\">\u003c/div>\n  \u003cdiv id=\"jt\" style=\"margin-top:12px\">\u003c/div>\n\u003c/div>\n\n\u003csection id=\"p_cal\">\n  \u003cdiv class=\"card\" id=\"qk\">\u003cinput id=\"qkIn\" type=\"text\" placeholder=\"⚡ Ketik cepat: makan ayam 30k\" enterkeyhint=\"send\" autocomplete=\"off\" style=\"margin-bottom:6px\">\u003cdiv class=\"hint\" id=\"qkHint\" style=\"margin:0\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"card calc\">\u003cdiv class=\"calhead\">\u003cdiv class=\"vtabs\">\u003cbutton id=\"vcal\" class=\"on\">📅 Kalender\u003c/button>\u003cbutton id=\"vlist\">📋 List\u003c/button>\u003c/div>\u003cbutton id=\"today\">📍 Hari ini\u003c/button>\u003c/div>\n  \u003cdiv id=\"calv\">\u003cdiv class=\"grid\" id=\"dows\">\u003c/div>\u003cdiv class=\"grid\" id=\"cal\" style=\"margin-top:4px\">\u003c/div>\u003c/div>\n  \u003cdiv id=\"listv\" class=\"hide\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"lg\">Tap tanggal untuk atur jatah & catat transaksi · angka biru = jatah harian · bar = terpakai vs jatah · 📌 = biaya tetap\u003c/div>\n  \n\u003c/section>\n kup\u003c/button>\n    \u003cbutton class=\"btn s\" id=\"impB\">Import backup\u003c/button>\n    \u003cinput type=\"file\" id=\"imp\" accept=\".json\" class=\"hide\">\n  \u003c/div>\n\u003c/section>\n\u003c/div>\n\n\u003cdiv id=\"toast\" class=\"toast hide\">\u003c/div>\n\u003cdiv id=\"ovl\" class=\"ovl hide\">\u003cdiv class=\"sheet\" id=\"dpanel\">\u003c/div>\u003c/div>\n\n\u003cnav class=\"tabs\" id=\"tabs\">\n  \u003cbutton data-t=\"cal\" class=\"on\">\u003cspan>📅\u003c/span>Kalender\u003c/button>\n  \u003cbutton id=\"fab\" class=\"fab\">➕\u003c/button>\n  \u003cbutton data-t=\"his\">\u003cspan>🧾\u003c/span>Riwayat\u003c/button>\n  \u003cbutton data-t=\"rec\">\u003cspan>📊\u003c/span>Rekap\u003c/button>\n  \u003cbutton data-t=\"rwd\">\u003cspan>🎀\u003c/span>Reward\u003c/button>\n\u003c/nav>\n\n\u003cscript>\nconst C={rwd:[[\"🎀\",\"Self Reward\"]],exp:[[\"🍜\",\"F&B\"],[\"🏨\",\"Accommodation\"],[\"🎮\",\"Entertainment\"],[\"🛍️\",\"Shopping\"],[\"🎲\",\"Random Needs\"]],inc:[[\"💼\",\"Gaji\"],[\"🎁\",\"Bonus\"],[\"✨\",\"Lainnya\"]]};\nconst CBG={\"F&B\":\"#ffe3c9\",\"Accommodation\":\"#d7e8ff\",\"Entertainment\":\"#e3d9ff\",\"Shopping\":\"#ffd9ec\",\"Random Needs\":\"#d7f5e4\",\"Gaji\":\"#d7f0ff\",\"Bonus\":\"#ffe7d1\",\"Lainnya\":\"#eee7ff\",\"Self Reward\":\"#ecdcfb\"};\nconst $=id=>document.getElementById(id);\nconst pad=n=>String(n).padStart(2,\"0\");\nconst iso=d=>d.getFullYear()+\"-\"+pad(d.getMonth()+1)+\"-\"+pad(d.getDate());\nconst num=v=>parseInt(String(v).replace(/\\D/g,\"\"))||0;\nconst dot=n=>String(Math.round(n)).replace(/\\B(?=(\\d{3})+(?!\\d))/g,\".\");\nfunction bindMoney(el){if(el)el.addEventListener(\"input\",()=>{const n=num(el.value);el.value=n?dot(n):\"\"})}\nfunction evalExpr(s){\n  s=s.replace(/[^0-9+\\-*/]/g,\"\").replace(/[+\\-*/]+$/,\"\");\n  if(!s||!/[+\\-*/]/.test(s))return null;\n  try{const v=Function('\"use strict\";return ('+s+')')();return isFinite(v)?Math.round(Math.abs(v)):null}catch(e){return null}\n}\nfunction bindCalc(id,onDone){\n  const el=$(id);if(!el)return;\n  el.addEventListener(\"input\",()=>{const v=el.value;if(/^[\\d.,]*$/.test(v)){const n=num(v);el.value=n?dot(n):v}else if(v.includes(\".\")){const p=el.selectionStart;el.value=v.replace(/\\./g,\"\");el.setSelectionRange(p-1,p-1)}});\n  const doCalc=()=>{const r=evalExpr(el.value);if(r!=null){el.value=dot(r);return true}return false};\n  el.addEventListener(\"blur\",doCalc);\n  el.onkeydown=e=>{if(e.key===\"Enter\"){e.preventDefault();if(/[+\\-*/]/.test(el.value)&&doCalc())return;if(onDone)onDone()}};\n}\nfunction normSet(sv){const d={dow:[200000,100000,100000,100000,100000,100000,200000],ov:{},roll:false,wallet:null};if(sv&&sv.wd!=null&&!sv.dow)sv.dow=[sv.we,sv.wd,sv.wd,sv.wd,sv.wd,sv.wd,sv.we];return Object.assign(d,sv||{})}\nconst rp=n=>(n\u003c0?\"-\":\"\")+\"Rp\"+dot(Math.abs(n));\nconst short=n=>n>=1e6?(n/1e6).toFixed(1).replace(\".0\",\"\").replace(\".\",\",\")+\"jt\":n>=1e3?(Math.round(n/1000*10)/10+\"\").replace(\".0\",\"\").replace(\".\",\",\")+\"k\":\"\"+n;\nlet calView=(localStorage.getItem(\"kl_view\")||\"cal\"),qa=null,set=normSet(),data=[],budgets={},view=new Date(),sel=iso(new Date()),tab=\"cal\",hf=\"all\",fc={exp:\"F&B\",inc:\"Gaji\",rwd:\"Self Reward\"},histScroll=false;\ntry{data=JSON.parse(localStorage.getItem(\"kl_data\")||\"[]\");budgets=JSON.parse(localStorage.getItem(\"kl_budget\")||\"{}\");set=normSet(JSON.parse(localStorage.getItem(\"kl_set\")||\"{}\"))}catch(e){}\nlet meta={sts:0,deleted:[]};\ntry{meta=Object.assign(meta,JSON.parse(localStorage.getItem(\"kl_meta\")||\"{}\"))}catch(e){}\nfunction saveLocal(){try{localStorage.setItem(\"kl_data\",JSON.stringify(data));localStorage.setItem(\"kl_budget\",JSON.stringify(budgets));localStorage.setItem(\"kl_set\",JSON.stringify(set));localStorage.setItem(\"kl_meta\",JSON.stringify(meta))}catch(e){}}\nfunction save(){saveLocal();schedSync()}\nfunction saveS(){meta.sts=Date.now();save()}\ntry{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}\nconst mk=()=>view.getFullYear()+\"-\"+pad(view.getMonth()+1);\nconst sumOf=(a,t)=>a.filter(x=>x.type===t).reduce((s,x)=>s+x.amt,0);\nconst icon=(t,c)=>(C[t].find(x=>x[1]===c)||[\"•\"])[0];\nconst sg=n=>n\u003c0?\"-\"+short(Math.round(-n)):short(Math.round(n));\nfunction effMap(){\n  const m={};\n  data.forEach(t=>{if(t.type!==\"exp\"||t.fixed)return;\n    if(t.spread>0){for(let i=0;i\u003ct.spread;i++){const d=new Date(t.date+\"T00:00:00\");d.setDate(d.getDate()+i);const k=iso(d);m[k]=(m[k]||0)+t.amt/t.spread}}\n    else m[t.date]=(m[t.date]||0)+t.amt});\n  return m;\n}\nfunction baseOf(k){if(set.ov[k]!=null)return set.ov[k];return set.dow[new Date(k+\"T00:00:00\").getDay()]}\nfunction allow(y,mo){\n  const em=effMap(),o={},n=new Date(y,mo+1,0).getDate();let c=0;\n  for(let d=1;d\u003c=n;d++){const k=y+\"-\"+pad(mo+1)+\"-\"+pad(d),b=baseOf(k),sp=em[k]||0,av=b+c,rem=av-sp;o[k]={b,c,av,sp,rem};c=Math.min(0,rem)}\n  return o;\n}\nlet tt;function toast(m){const e=$(\"toast\");e.textContent=m;e.classList.remove(\"hide\");clearTimeout(tt);tt=setTimeout(()=>e.classList.add(\"hide\"),2200)}\nfunction closeDay(){qa=null;$(\"ovl\").classList.add(\"hide\")}\n$(\"ovl\").onclick=e=>{if(e.target===$(\"ovl\"))closeDay()};\ndocument.addEventListener(\"keydown\",e=>{if(e.key===\"Escape\")closeDay()});\nfunction editTx(id){\n  const t=data.find(x=>x.id===id);if(!t)return;\n  sel=t.date;view=new Date(sel+\"T00:00:00\");fc[t.type]=t.cat;qa={type:t.type,edit:id};\n  render();$(\"ovl\").classList.remove(\"hide\");\n}\nfunction dayPanel(){\n  const sd=new Date(sel+\"T00:00:00\"),y=sd.getFullYear(),mo=sd.getMonth(),nd=new Date(y,mo+1,0).getDate();\n  const A=allow(y,mo)[sel],hasOv=set.ov[sel]!=null,def=set.dow[sd.getDay()],wn=sd.toLocaleDateString(\"id-ID\",{weekday:\"long\"});\n  const fx=sumOf(data.filter(x=>x.date.startsWith(y+\"-\"+pad(mo+1))&&x.fixed),\"exp\"),dl=data.filter(x=>x.date===sel&&x.type!==\"rwd\");\n  $(\"dpanel\").innerHTML=`\u003cdiv class=\"ph\">\u003ch3>${sd.toLocaleDateString(\"id-ID\",{weekday:\"long\",day:\"numeric\",month:\"long\"})}${sel===iso(new Date())?' \u003cspan class=\"tag\">hari ini\u003c/span>':\"\"}\u003c/h3>\u003cbutton class=\"xb\" id=\"dx\">✕\u003c/button>\u003c/div>\n\u003cdiv class=\"jsub\" style=\"display:flex;align-items:center;gap:6px;margin:-6px 0 8px\">\u003cspan>📅\u003c/span>\u003cinput type=\"date\" id=\"selDate\" value=\"${sel}\" style=\"width:auto;padding:6px 8px;font-size:.8rem;margin:0;border-radius:10px\">\u003cbutton class=\"lnk\" id=\"selToday\" style=\"margin-left:2px\">Hari ini\u003c/button>\u003c/div>\n\u003cdiv class=\"budbox\">\u003clabel class=\"lb\">🎯 Jatah hari ini · ketik lalu Simpan\u003c/label>\n\u003cdiv class=\"er\">\u003cinput type=\"text\" inputmode=\"numeric\" id=\"dj\" value=\"${dot(A.b)}\">\u003cbutton id=\"djB\">Simpan\u003c/button>\u003c/div>\n\u003cdiv class=\"pbar\">\u003ci class=\"${A.sp>A.av?\"over\":\"\"}\" style=\"width:${Math.max(A.av>0?Math.min(A.sp/A.av,1):(A.sp>0?1:0),A.sp>0?.04:0)*100}%\">\u003c/i>\u003c/div>\n\u003cdiv class=\"jsub\" style=\"display:flex;justify-content:space-between\">\u003cspan>${A.c?`Efektif ${rp(A.av)} · `:\"\"}Terpakai ${rp(A.sp)}\u003c/span>\u003cb>${A.av>0?Math.round(A.sp/A.av*100):(A.sp>0?100:0)}%\u003c/b>\u003c/div>\n\u003cdiv class=\"jsub\">${A.c?`(${A.c\u003c0?\"dikurangi kelebihan kemarin\":\"ditambah sisa kemarin\"} ${rp(Math.abs(A.c))}) · `:\"\"}Sisa \u003cb class=\"${A.rem\u003c0?\"exp\":\"inc\"}\">${rp(A.rem)}\u003c/b>\u003c/div>\n${A.rem>0?`\u003cbutton class=\"lnk\" id=\"djRoll\">💰 Tambahin sisa ${rp(A.rem)} ke jatah besok?\u003c/button>`:\"\"}\n\u003cdiv class=\"jsub\">\u003cbutton class=\"lnk\" id=\"djA\">Terapkan ke semua ${wn} bulan ini\u003c/button>${hasOv?' · \u003cbutton class=\"lnk\" id=\"djR\">Reset\u003c/button>':\"\"}\u003c/div>\n${fx?`\u003cdiv class=\"jsub\">📌 Biaya tetap bulan ini ${rp(fx)} ≈ ${rp(fx/nd)}/hari, terpisah dari jatah\u003c/div>`:\"\"}\u003c/div>\n\u003cdiv class=\"qbs\">\u003cbutton class=\"qb e${qa&&qa.type===\"exp\"?\" on\":\"\"}\" data-q=\"exp\">💸 Pengeluaran\u003c/button>\u003cbutton class=\"qb i${qa&&qa.type===\"inc\"?\" on\":\"\"}\" data-q=\"inc\">💰 Pemasukan\u003c/button>\u003c/div>\n\u003cdiv id=\"qaf\">\u003c/div>\u003cdiv id=\"dayList\" style=\"margin-top:8px\">\u003c/div>`;\n  bindMoney($(\"dj\"));$(\"dx\").onclick=closeDay;\n  $(\"selDate\").onchange=e=>{if(!e.target.value)return;sel=e.target.value;view=new Date(sel+\"T00:00:00\");render()};\n  $(\"selToday\").onclick=()=>{sel=iso(new Date());view=new Date();render()};\n  const saveJ=()=>{if($(\"dj\").value===\"\")return;const v=num($(\"dj\").value);if(v===def)delete set.ov[sel];else set.ov[sel]=v;saveS();toast(\"Jatah tersimpan ✓\");closeDay();render()};\n  $(\"djB\").onclick=saveJ;$(\"dj\").onkeydown=e=>{if(e.key===\"Enter\")saveJ()};\n  if($(\"djRoll\"))$(\"djRoll\").onclick=()=>{\n    const tmS=new Date(sd);tmS.setDate(tmS.getDate()+1);const tmk=iso(tmS),newTm=baseOf(tmk)+A.rem;\n    set.ov[sel]=A.sp-A.c;set.ov[tmk]=newTm;saveS();toast(\"Sisa dipindah ke besok ✓\");render();\n  };\n  $(\"djA\").onclick=()=>{if($(\"dj\").value===\"\")return;const v=num($(\"dj\").value);\n    for(let d=1;d\u003c=nd;d++){const k=y+\"-\"+pad(mo+1)+\"-\"+pad(d);if(new Date(k+\"T00:00:00\").getDay()===sd.getDay()){if(v===def)delete set.ov[k];else set.ov[k]=v}}\n    saveS();toast(\"Berlaku untuk semua \"+wn+\" ✓\");closeDay();render()};\n  if($(\"djR\"))$(\"djR\").onclick=()=>{delete set.ov[sel];saveS();closeDay();render()};\n  $(\"dpanel\").querySelectorAll(\".qb\").forEach(b=>b.onclick=()=>{qa=(qa&&!qa.edit&&qa.type===b.dataset.q)?null:{type:b.dataset.q};render()});\n  $(\"dayList\").innerHTML=dl.length?dl.map(x=>row(x)).join(\"\"):'\u003cdiv class=\"muted\">Belum ada catatan 🐚\u003c/div>';bindDel($(\"dayList\"));\n  qaForm();\n}\nfunction qaForm(){\n  const el=$(\"qaf\");if(!qa){el.innerHTML=\"\";return}\n  const t=qa.type,tx=qa.edit?data.find(x=>x.id===qa.edit):null;\n  if(qa.edit&&!tx){qa=null;el.innerHTML mplate-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}\n.gh{grid-column:1/-1;font-family:Pacifico,cursive;color:var(--ac);font-size:18px;margin-top:8px}\n.it{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;cursor:pointer;display:flex;gap:12px;align-items:center;box-shadow:0 4px 14px #f472b61f;transition:transform .15s,box-shadow .15s}\n.it:hover{transform:translateY(-3px);box-shadow:0 8px 20px #7cb7ff44}\n.ic{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-size:20px;flex:none}\n.it b{display:block}.it small{color:var(--mut)}\n.view{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:20px;box-shadow:0 8px 28px #7cb7ff33;margin-top:12px}\nh2{font-family:Pacifico,cursive;font-weight:400;font-size:28px;margin:0;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}\n.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:12px 0}\n.chips{margin:8px 0}.chips span{display:inline-grid;place-items:center;min-width:46px;height:50px;padding:0 10px;margin:4px;color:#fff;font-weight:800;background:linear-gradient(160deg,var(--ac),var(--ac2));border-radius:50% 50% 50% 50%/38% 38% 62% 62%;box-shadow:0 3px 8px #7cb7ff55}\npre{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.5;overflow-x:auto;margin:14px 0 0;white-space:pre}\npre .c{color:var(--ch);font-weight:700}pre .s{color:var(--ac);font-weight:800}\n.mut{color:var(--mut);font-size:13px}a{color:var(--ac);font-weight:700}\n.empty{text-align:center;color:var(--mut);padding:30px}\ndialog{max-height:92vh;overflow:auto;border:1px solid var(--bd);border-radius:22px;background:var(--card);color:var(--tx);width:min(560px,94vw);padding:18px}\ndialog::backdrop{background:#6b5f9a55}\n.box{background:var(--bg);border:1px dashed var(--ac);border-radius:14px;padding:10px 14px;margin:12px 0}.box pre{margin:6px 0 0}\ndialog label{display:block;font-size:13px;color:var(--mut);margin:9px 0 3px}\ndialog input,dialog textarea{width:100%}\ntextarea{min-height:170px;font-family:ui-monospace,Menlo,monospace;font-size:13px}\n.row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}\n#toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;padding:9px 18px;border-radius:20px;font-weight:800;display:none}\n.gchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.gchips button{padding:4px 13px;border-radius:20px;font-size:14px}\n.tag{display:inline-block;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;font-weight:800;border-radius:20px;padding:3px 12px;margin:3px 3px 3px 0;cursor:pointer;font-size:13px}\n.tools2{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px}.tools2 button{padding:4px 12px}\n.it>div:nth-child(2){flex:1;min-width:0}\n.fv{margin-left:auto;background:none;border:none;font-size:22px;padding:0 4px;box-shadow:none}\n.st{font-size:28px;cursor:pointer;color:#f5b301;margin-right:2px;user-select:none}.rate{margin-left:6px}\n#asbar{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;background:var(--card);border:1px solid var(--bd);border-radius:30px;padding:8px 14px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 22px #82b8ff66;z-index:5;max-width:94vw}\n#asbar input[type=range]{width:110px;padding:0;accent-color:var(--ac)}\n.dgs{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}\n.dg{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:6px 10px 4px;text-align:center}\n.dg b{display:block;color:var(--ch)}.dg svg{display:block;margin:2px auto}\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n#asbar{bottom:calc(14px + env(safe-area-inset-bottom,0px))}\n#sync{cursor:pointer;color:#fff;font-size:13px;font-weight:700;background:#ffffff33;border-radius:12px;padding:3px 10px}\n.ck{cursor:pointer;border-radius:4px}pre .ck:hover{background:#82b8ff44}\n#tip{position:fixed;z-index:20;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:6px 10px 4px;box-shadow:0 8px 24px #82b8ff77;pointer-events:none;text-align:center}\n#tip b{display:block}#tip svg{display:block;margin:2px auto}\n.grow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}\n.ro #add,.ro #ed,.ro #del,.ro #favb,.ro .rate,.ro .fv,.ro #gmng{display:none!important}\nbody:not(.ro) #login{display:none}\n.ic{overflow:hidden}.ic img{width:100%;height:100%;object-fit:cover;display:block}\n.ic.cv{width:54px;height:54px;border-radius:14px;box-shadow:0 3px 10px #f472b655}\n.hd{display:flex;gap:14px;align-items:center}\n.cover{width:78px;height:78px;border-radius:16px;object-fit:cover;box-shadow:0 4px 14px #f472b655;flex:none}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\n  \u003ch1>\u003csvg viewBox=\"0 0 64 64\" width=\"38\" height=\"38\">\u003cg transform=\"rotate(45 32 32)\" fill=\"#fff\">\u003crect x=\"29\" y=\"2\" width=\"6\" height=\"30\" rx=\"2\"/>\u003crect x=\"27\" y=\"0\" width=\"10\" height=\"9\" rx=\"3\"/>\u003cellipse cx=\"32\" cy=\"40\" rx=\"13\" ry=\"10\"/>\u003cellipse cx=\"32\" cy=\"53\" rx=\"16\" ry=\"11\"/>\u003ccircle cx=\"32\" cy=\"46\" r=\"5\" fill=\"#f472b6\"/>\u003c/g>\u003c/svg>Chord Library\u003c/h1>\n  \u003cspan id=\"sync\" title=\"\">⏳\u003c/span>\n  \u003cbutton id=\"login\">🔑 Login edit\u003c/button>\n  \u003cbutton class=\"p\" id=\"add\">+ Lagu\u003c/button>\n\u003c/header>\n\u003cmain>\n  \u003csection id=\"home\">\n    \u003cdiv class=\"bar\">\n      \u003cinput id=\"q\" placeholder=\"🔍 Cari judul / artis / genre…\">\n      \u003cselect id=\"sort\">\u003coption value=\"az\">A–Z\u003c/option>\u003coption value=\"genre\">Per genre\u003c/option>\u003coption value=\"artist\">Per artis\u003c/option>\u003coption value=\"new\">Terbaru\u003c/option>\u003coption value=\"rate\">Rating tertinggi\u003c/option>\u003c/select>\n      \u003cselect id=\"rf\">\u003coption value=\"\">Semua rating\u003c/option>\u003coption value=\"5\">★★★★★ (5)\u003c/option>\u003coption value=\"4\">★★★★ (4)\u003c/option>\u003coption value=\"3\">★★★ (3)\u003c/option>\u003coption value=\"2\">★★ (2)\u003c/option>\u003coption value=\"1\">★ (1)\u003c/option>\u003coption value=\"0\">Belum dirating\u003c/option>\u003c/select>\n    \u003c/div>\n    \u003cdiv class=\"gchips\" id=\"gchips\">\u003c/div>\n    \u003cdiv class=\"list\" id=\"list\">\u003c/div>\n  \u003c/section>\n  \u003csection id=\"page\" hidden>\n    \u003cbutton id=\"back\">← Semua lagu\u003c/button>\n    \u003cdiv id=\"musicbox\" class=\"box\" hidden>\u003c/div>\n    \u003cdiv class=\"view\" id=\"view\">\u003c/div>\n  \u003c/section>\n\u003c/main>\n\u003cdiv id=\"asbar\" hidden>\u003cbutton id=\"asplay\" class=\"p\">▶ Auto-scroll\u003c/button>\u003cspan>🐢\u003c/span>\u003cinput type=\"range\" id=\"asspd\" min=\"1\" max=\"10\" value=\"4\">\u003cspan>🐇\u003c/span>\u003cb id=\"aslbl\">4\u003c/b>\u003cbutton id=\"astop\" title=\"Ke atas\">⬆\u003c/button>\u003c/div>\n\u003cdiv id=\"tip\" hidden>\u003c/div>\n\u003cdiv id=\"toast\">\u003c/div>\n\n\u003cdialog id=\"dlg\">\n  \u003ch3 id=\"dt\" style=\"margin:0 0 6px;font-family:Pacifico,cursive;font-weight:400;color:var(--ac)\">Tambah lagu\u003c/h3>\n  \u003clabel>Link Ultimate Guitar (judul &amp; artis terisi otomatis)\u003c/label>\u003cinput id=\"f-link\" placeholder=\"https://tabs.ultimate-guitar.com/...\">\n  \u003clabel>🎵 Link musik (YouTube / Spotify, opsional)\u003c/label>\u003cinput id=\"f-music\" placeholder=\"https://youtu.be/... atau open.spotify.com/track/...\">\n  \u003clabel>Judul\u003c/label>\u003cinput id=\"f-title\">\n  \u003clabel>Artis\u003c/label>\u003cinput id=\"f-artist\">\n  \u003clabel>Genre (bisa lebih dari satu) \u003cbutton type=\"button\" id=\"gmng\" style=\"padding:2px 10px;margin-left:6px\">🗑 Kelola genre\u003c/button>\u003c/label>\n  \u003cdiv id=\"gsel\">\u003c/div>\n  \u003cdiv class=\"row\" style=\"justify-content:stretch;margin:6px 0 0\">\u003cselect id=\"gpick\" style=\"flex:1;min-width:0\">\u003c/select>\u003cinput id=\"gnew\" placeholder=\"atau ketik genre baru\" style=\"flex:1;min-width:0\">\u003cbutton type=\"button\" id=\"gadd\">+\u003c/button>\u003c/div>\n  \u003clabel>Capo (kalau ada)\u003c/label>\u003cselect id=\"f-capo\" style=\"width:100%\">\u003coption value=\"0\">Tanpa capo\u003c/option>\u003coption value=\"1\">Capo fret 1\u003c/option>\u003coption value=\"2\">Capo fret 2\u003c/option>\u003coption value=\"3\">Capo fret 3\u003c/option>\u003coption value=\"4\">Capo fret 4\u003c/option>\u003coption value=\"5\">Capo fret 5\u003c/option>\u003coption value=\"6\">Capo fret 6\u003c/option>\u003coption value=\"7\">Capo fret 7\u003c/option>\u003coption value=\"8\">Capo fret 8\u003c/option>\u003coption value=\"9\">Capo fret 9\u003c/option>\u003c/select>\n  \u003clabel>Chord + lirik \u003cbutton id=\"paste\" type=\"button\" style=\"padding:2px 10px;margin-left:6px\">📋 Paste\u003c/button>\u003c/label>\u003ctextarea id=\"f-text\" placeholder=\"Paste chord di sini\">\u003c/textarea>\n  \u003clabel>🥁 Strumming / gejrengan (opsional)\u003c/label>\n  \u003cdiv class=\"tools2\">\u003cbutton type=\"button\" id=\"spaste\">📋 Paste\u003c/button>\u003cbutton type=\"button\" id=\"sfile\">📷 Pilih gambar\u003c/button>\u003cbutton type=\"button\" class=\"ar\" data-a=\"↓\">↓\u003c/button>\u003cbutton type=\"button\" class=\"ar\" data-a=\"↑\">↑\u003c/button>\u003cbutton type=\"button\" class=\"ar\" data-a=\"✕\">✕\u003c/button>\u003c/div>\n  \u003cinput type=\"file\" id=\"sfilein\" accept=\"image/*\" hidden>\n  \u003cdiv id=\"simg\">\u003c/div>\n  \u003ctextarea id=\"f-strum\" style=\"min-height:60px\" placeholder=\"Boleh paste gambar strumming (Ctrl+V), atau ketik: ↓ ↓↑ ↑↓↑\">\u003c/textarea>\n  \u003clabel>🎹 Chord piano (opsional, paste terpisah — teks atau foto)\u003c/label>\n  \u003cdiv class=\"tools2\">\u003cbutton type=\"button\" id=\"ppaste\">📋 Paste\u003c/button>\u003cbutton type=\"button\" id=\"pfile\">📷 Pilih gambar\u003c/button>\u003c/div>\n  \u003cinput type=\"file\" id=\"pfilein\" accept=\"image/*\" hidden>\n  \u003cdiv id=\"pimg\">\u003c/div>\n  \u003ctextarea id=\"f-piano\" style=\"min-height:90px\" placeholder=\"Paste chord piano di sini. Screenshot/foto juga bisa (Ctrl+V atau tombol Paste).\">\u003c/textarea\u003c/textarea>\n  \u003cdiv class=\"row\">\u003cbutton id=\"cancel\">Batal\u003c/button>\u003cbutton class=\"p\" id=\"save\">Simpan\u003c/button>\u003c/div>\n\u003c/dialog>\n\n\u003cdialog id=\"dlg4\">\n  \u003ch3 style=\"margin:0 0 6px;font-family:Pacifico,cursive;font-weight:400;color:var(--ac)\">Kelola genre\u003c/h3>\n  \u003cp class=\"mut\">Hapus genre yang tidak kamu pakai. Genre yang dihapus juga dilepas dari semua lagu yang memilikinya.\u003c/p>\n  \u003cdiv id=\"glist\">\u003c/div>\n  \u003cdiv class=\"row\">\u003cbutton class=\"p\" id=\"g4close\">Selesai\u003c/button>\u003c/div>\n\u003c/dialog>\n\n\u003cdialog id=\"dlg3\">\n  \u003ch3 style=\"margin:0 0 6px;font-family:Pacifico,cursive;font-weight:400;color:var(--ac)\">☁ Sync &amp; mode edit\u003c/h3>\n  \u003cp class=\"mut\" id=\"g-info\">\u003c/p>\n  \u003cdiv id=\"g-in\">\u003clabel>Password edit\u003c/label>\u003cinput id=\"g-pw\" type=\"password\" autocomplete=\"off\">\u003c/div>\n  \u003cdiv class=\"row\">\u003cbutton id=\"g-logout\">Keluar mode edit\u003c/button>\u003cbutton id=\"g-close\">Tutup\u003c/button>\u003cbutton class=\"p\" id=\"g-login\">Masuk mode edit\u003c/button>\u003c/div>\n\u003c/dialog>\n\n\u003cscript>\nconst KEY='chordlib_v1',$=id=>document.getElementById(id);\nlet songs=load(),cur=null,tr=0,simp=false,editId=null;\nfunction load(){try{const a=JSON.parse(localStorage.getItem(KEY));return Array.isArray(a)?a.filter(x=>x&&x.id):[]}catch(e){return[]}}\n/* ====== SYNC (Google Apps Script) — tempel URL web app kamu di baris bawah ini ====== */\nconst SYNC_URL='https://script.google.com/macros/s/AKfycbzP46Yqyinmn7Rmrps37HfkEr4C_rbBdLyV1RwG5JiB_D9KgoHtuHwYSPZtXoSp40n1/exec';\nconst SYNC_ON=/^https:\\/\\/script\\.google\\.com\\//.test(SYNC_URL);\nconst NO_PW=true,EDIT_PW=''; // NO_PW: masuk mode edit cukup dengan klik. Kalau Apps Script masih pakai password, isi EDIT_PW dengan password itu.\nconst editFlag=()=>{try{return localStorage.getItem('chordlib_edit')==='1'}catch(e){return false}};\nconst setEditFlag=v=>{try{v?localStorage.setItem('chordlib_edit','1'):localStorage.removeItem('chordlib_edit')}catch(e){}};\nlet authErr=null,tomb={},sig={},busy=false,again=false,st=0,canEdit=!SYNC_ON,pw='',dirty=false;\ntry{tomb=JSON.parse(localStorage.getItem('chordlib_tomb'))||{}}catch(e){}\ntry{pw=localStorage.getItem('chordlib_pw')||'';dirty=localStorage.getItem('chordlib_dirty')==='1'}catch(e){}\nif(SYNC_ON&&pw)canEdit=true;\nif(SYNC_ON&&NO_PW&&editFlag()){pw=EDIT_PW;canEdit=true}\nlet syncedU={},wm=0,tombPosted='';try{syncedU=JSON.parse(localStorage.getItem('chordlib_su'))||{};wm=+localStorage.getItem('chordlib_wm')||0;tombPosted=localStorage.getItem('chordlib_tp')||''}catch(e){}\nsongs.forEach(x=>sig[x.id]=JSON.stringify({...x,u:0}));\nfunction setSync(k,e){const el=$('sync');el.textContent={ok:'☁ Tersinkron',view:'👀 Mode lihat · klik untuk edit',local:'💾 Lokal saja',err:'⚠ Gagal sync · klik',wait:'⏳ Sync…'}[k];el.title=(e&&e.message)||''}\nfunction saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(songs));localStorage.setItem('chordlib_tomb',JSON.stringify(tomb));localStorage.setItem('chordlib_dirty',dirty?'1':'0');localStorage.setItem('chordlib_su',JSON.stringify(syncedU));localStorage.setItem('chordlib_wm',String(wm));localStorage.setItem('chordlib_tp',tombPosted)}catch(e){}}\nfunction persist(){\n  const now=new Set(songs.map(x=>x.id));\n  songs.forEach(x=>{const j=JSON.stringify({...x,u:0});if(sig[x.id]!==j){sig[x.id]=j;x.u=Date.now();delete tomb[x.id]}});\n  Object.keys(sig).forEach(id=>{if(!now.has(id)){delete sig[id];tomb[id]=Date.now()}});\n  if(SYNC_ON&&canEdit)dirty=true;\n  saveLocal();\n  if(SYNC_ON&&canEdit){setSync('wait');if(busy)again=true;else{clearTimeout(st);st=setTimeout(syncNow,800)}}\n}\nfunction sigOf(a){return JSON.stringify([...a].sort((x,y)=>x.id\u003cy.id?-1:1))}\nfunction refresh(){\n  if(!cur&&/s=\\d+/.test(location.hash)){route();return}\n  if(cur){const n=songs.find(x=>x.id===cur.id);if(n){cur=n;show();renderMusic()}else go('')}\n  else render();\n}\nlet warnedEmpty=false;\nfunction merge(r){\n  const m=new Map();\n  [...songs,...(r.songs||[])].forEach(x=>{const o=m.get(x.id);if(!o||(x.u||0)>(o.u||0))m.set(x.id,x)});\n  const t={...(r.tomb||{})};\n  Object.keys(tomb).forEach(id=>{if((tomb[id]||0)>(t[id]||0))t[id]=tomb[id]});\n  Object.keys(t).forEach(id=>{const x=m.get(id);if(x&&(x.u||0)\u003c=t[id])m.delete(id)});\n  return{songs:[...m.values()],tomb:t};\n}\nconst pendingSongs=()=>songs.filter(x=>syncedU[x.id]!==(x.u||0));\nfunction applyRemote(r){\n  const rs=(r.songs||[]).filter(x=>x&&x.id),before=sigOf(songs);\n  if(!canEdit&&!rs.length&&!r.delta&&songs.length&&!warnedEmpty){warnedEmpty=true;toast('Server masih kosong. Klik 🔑 Login edit untuk mengunggah lagumu.')}\n  const m=merge({songs:rs,tomb:r.tomb||{}});songs=m.songs;tomb=m.tomb;\n  const by=new Map(songs.map(x=>[x.id,x]));\n  rs.forEach(x=>{const y=by.get(x.id);if(y&&(y.u||0)===(x.u||0))syncedU[x.id]=x.u||0;if((x.u||0)>wm)wm=x.u||0});\n  Object.keys(syncedU).forEach(id=>{if(!by.has(id))delete syncedU[id]});\n  Object.values(tomb).forEach(v=>{if(v>wm)wm=v});\n  sig={};songs.forEach(x=>sig[x.id]=JSON.stringify({...x,u:0}));\n  saveLocal();if(sigOf(songs)!==before)refresh();\n}\nasync function syncNow(pull){\n  if(!SYNC_ON||busy)return;\n  busy=true;setSync('wait');let posted=false;\n  try{\n    if(canEdit){\n      const pend=pendingSongs(),tj=JSON.stringify(tomb);\n      if(pend.length||tj!==tombPosted){\n        const snap=pend.map(x=>[x.id,x.u|| .parse(localStorage.getItem('chordlib_cov'))||{}}catch(e){}\nconst coverTried=new Set();\nfunction coverOf(x){\n  const u=(x.music||'').trim();if(!u)return'';\n  try{\n    const l=new URL(u),h=l.hostname.replace(/^www\\.|^m\\.|^music\\./,'');\n    let id='';\n    if(h==='youtu.be')id=l.pathname.slice(1);\n    else if(h==='youtube.com')id=l.searchParams.get('v')||(l.pathname.match(/\\/(?:shorts|embed|live)\\/([\\w-]+)/)||[])[1]||'';\n    if(id)return`https://i.ytimg.com/vi/${id}/mqdefault.jpg`;\n    if(h==='open.spotify.com'){\n      if(covers[u])return covers[u];\n      if(!coverTried.has(u)){coverTried.add(u);fetchCover(u)}\n    }\n  }catch(e){}\n  return'';\n}\nasync function fetchCover(u){\n  try{\n    const j=await(await fetch('https://open.spotify.com/oembed?url='+encodeURIComponent(u))).json();\n    if(j&&j.thumbnail_url){covers[u]=j.thumbnail_url;try{localStorage.setItem('chordlib_cov',JSON.stringify(covers))}catch(e){}refresh()}\n  }catch(e){}\n}\nfunction icon(x){\n  const c=coverOf(x);\n  return c?`\u003cdiv class=\"ic cv\">\u003cimg src=\"${esc(c)}\" alt=\"\" loading=\"lazy\" onerror=\"this.parentNode.className='ic';this.parentNode.textContent='🎵'\">\u003c/div>`:'\u003cdiv class=\"ic\">🎵\u003c/div>';\n}\n/* ---- chord logic ---- */\nconst IDX={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};\nconst NAMES=['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];\nconst CH=/^([A-G][#b]?)((?:maj|min|m|M|dim|aug|sus|add|\\+|-|\\(|\\)|#|b|\\d|o|°)*)(?:\\/([A-G][#b]?))?$/;\nconst OPEN=new Set(['C','D','E','G','A','Am','Dm','Em']);\nconst name=i=>NAMES[((i%12)+12)%12];\nfunction conv(tok,t,s){\n  const m=CH.exec(tok);if(!m||IDX[m[1]]===undefined)return tok;\n  let q=m[2];if(s)q=/^(m(?!aj)|min|dim)/.test(q)?'m':'';\n  let o=name(IDX[m[1]]+t)+q;\n  if(!s&&m[3]&&IDX[m[3]]!==undefined)o+='/'+name(IDX[m[3]]+t);\n  return o;\n}\nfunction isChordLine(l){\n  const tk=l.trim().split(/\\s+/).filter(x=>x&&!/^(\\||x\\d+|\\/|-|\\.\\. -gradient(135deg,#ffc9a3,var(--pri2));margin-top:10px}\n.btn.s{background:var(--soft);color:var(--ink)}.btn.d{background:#ffe0e6;color:#d9647d}\n.hint{font-size:.78rem;color:var(--mut)}\n.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:#8a5a3b;color:#fff;padding:9px 16px;border-radius:999px;font-weight:700;z-index:30;font-size:.85rem;pointer-events:none;max-width:90%;text-align:center}\n.hide{display:none}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n  \u003cdiv class=\"top\">\u003ch1>🍽️ Food Diary\u003c/h1>\u003cbutton id=\"gear\" aria-label=\"Pengaturan\">⚙️\u003c/button>\u003c/div>\n  \u003cdiv class=\"sub\" id=\"cs\">Foto makananmu, AI yang menghitung kalorinya.\u003c/div>\n  \u003cdiv class=\"card hide\" id=\"cloud\">\u003cdiv id=\"cloudtxt\" style=\"font-size:.86rem;font-weight:700;margin-bottom:8px\">\u003c/div>\u003cbutton class=\"btn\" id=\"cloudbtn\" style=\"margin-top:0\">Masuk dengan Google\u003c/button>\u003c/div>\n  \u003cdiv class=\"card nav\">\u003cbutton id=\"prev\">‹\u003c/button>\u003cb id=\"dTitle\">\u003c/b>\u003cbutton id=\"next\">›\u003c/button>\u003cbutton class=\"pill\" id=\"dToday\">Hari ini\u003c/button>\u003c/div>\n  \u003cdiv class=\"card\">\n    \u003cdiv class=\"big\">\u003cspan id=\"kTot\">0\u003c/span>\u003csmall id=\"kGoal\">\u003c/small>\u003c/div>\n    \u003cdiv class=\"pb\">\u003ci id=\"kBar\" style=\"width:0%\">\u003c/i>\u003c/div>\n    \u003cdiv class=\"chips\" id=\"kChips\">\u003c/div>\n    \u003ch3 style=\"margin-bottom:6px\">🤖 Ringkasan hari ini\u003c/h3>\n    \u003cdiv class=\"ai\" id=\"aiBox\">\u003c/div>\n    \u003cdiv style=\"margin-top:6px\">\u003cbutton class=\"lnk\" id=\"aiEdit\">✏️ Edit\u003c/button>\u003cbutton class=\"lnk\" id=\"aiRe\">✨ Buat ulang\u003c/button>\u003c/div>\n  \u003c/div>\n  \u003cdiv id=\"slots\">\u003c/div>\n\u003c/div>\n\u003cdiv class=\"bar\">\u003cbutton class=\"main\" id=\"bCam\">📷 Foto makanan\u003c/button>\u003cbutton class=\"sec\" id=\"bGal\">🖼️ Galeri\u003c/button>\u003cbutton class=\"sec\" id=\"bMan\">✍️\u003c/button>\u003c/div>\n\u003cinput type=\"file\" id=\"fCam\" accept=\"image/*\" capture=\"environment\" hidden>\n\u003cinput type=\"file\" id=\"fGal\" accept=\"image/*\" multiple hidden>\n\u003cdiv id=\"ovl\" class=\"ovl hide\">\u003cdiv class=\"sheet\" id=\"sheet\">\u003c/div>\u003c/div>\n\u003cdiv id=\"toast\" class=\"toast hide\">\u003c/div>\n\u003cscript>\n// ======================= dasar =======================\nconst $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,\"0\");\nconst iso=d=>d.getFullYear()+\"-\"+pad(d.getMonth()+1)+\"-\"+pad(d.getDate());\nconst hhmm=t=>{const d=new Date(t);return pad(d.getHours())+\":\"+pad(d.getMinutes())};\nconst dot=n=>String(Math.round(+n||0)).replace(/\\B(?=(\\d{3})+(?!\\d))/g,\".\");\nconst num=v=>parseInt(String(v).replace(/\\D/g,\"\"))||0;\nconst esc=s=>String(s==null?\"\":s).replace(/[&\u003c>\"']/g,c=>({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c]));\nconst SLOTS=[[\"pagi\",\"🌅\",\"Pagi\"],[\"siang\",\"☀️\",\"Siang\"],[\"sore\",\"🌇\",\"Sore\"],[\"malam\",\"🌙\",\"Malam\"]];\nconst slotName=k=>(SLOTS.find(s=>s[0]===k)||SLOTS[0])[2];\nfunction slotOf(t){const h=new Date(t).getHours();return h>=4&&h\u003c11?\"pagi\":h>=11&&h\u003c15?\"siang\":h>=15&&h\u003c18?\"sore\":\"malam\"}\nconst FIREBASE_CONFIG={apiKey:\"AIzaSyAst48Qjumjn2heLhHTm66Sx3qAyHxSa_Q\",authDomain:\"kantong-laut.firebaseapp.com\",projectId:\"kantong-laut\",storageBucket:\"kantong-laut.firebasestorage.app\",messagingSenderId:\"866417365408\",appId:\"1:866417365408:web:dc9ff60dc969e8ef5dd4c5\"};\nlet food={entries:[],sums:{},deleted:[],goal:1800,gu:0},cfg={provider:\"gemini\",key:\"\",model:\"\",ku:0};\nlet day=iso(new Date()),user=null,db=null,auth=null,authReady=false,aiEditing=false,sumBusy=false,lastSt=\"\";\ntry{food=Object.assign(food,JSON.parse(localStorage.getItem(\"fd_data\")||\"{}\"));cfg=Object.assign(cfg,JSON.parse(localStorage.getItem(\"fd_cfg\")||\"{}\"))}catch(e){}\nfunction saveLocal(){try{localStorage.setItem(\"fd_data\",JSON.stringify(food));localStorage.setItem(\"fd_cfg\",JSON.stringify(cfg))}catch(e){}}\nfunction save(){saveLocal();schedSync()}\nlet tt;function toast(m){const e=$(\"toast\");e.textContent=m;e.classList.remove(\"hide\");clearTimeout(tt);tt=setTimeout(()=>e.classList.add(\"hide\"),2400)}\n\n// ======================= foto disimpan di perangkat (IndexedDB) =======================\nconst idb=new Promise((ok,no)=>{try{const r=indexedDB.open(\"fooddiary\",1);r.onupgradeneeded=()=>r.result.createObjectStore(\"img\");r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}});\nconst imgPut=(id,blob)=>idb.then(d=>new Promise((ok,no)=>{const t=d.transaction(\"img\",\"readwrite\");t.objectStore(\"img\").put(blob,id);t.oncomplete=ok;t.onerror=()=>no(t.error)})).catch(()=>{});\nconst imgGet=id=>idb.then(d=>new Promise(ok=>{const r=d.transaction(\"img\").objectStore(\"img\").get(id);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>ok(null)})).catch(()=>null);\nconst imgDel=id=>idb.then(d=>{d.transaction(\"img\",\"readwrite\").objectStore(\"img\").delete(id)}).catch(()=>{});\nconst urls=new Map();\nasync function shrink(file,max){\n  max=max||640;\n  let src,w,h;\n  try{src=await createImageBitmap(file,{imageOrientation:\"from-image\"});w=src.width;h=src.height}\n  catch(e){src=await new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=URL.createObjectURL(file)});w=src.naturalWidth;h=src.naturalHeight}\n  const k=Math.min(1,max/Math.max(w,h)),c=document.createElement(\"canvas\");\n  c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));\n  c.getContext(\"2d\").drawImage(src,0,0,c.width,c.height);\n  const blob=await new Promise(ok=>c.toBlob(ok,\"image/jpeg\",0.7));\n  return {blob,b64:await blobB64(blob)};\n}\nconst blobB64=b=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(\",\")[1]);r.readAsDataURL(b)});\nfunction fillThumbs(){\n  document.querySelectorAll(\"[data-th]\").forEach(el=>{\n    const id=+el.dataset.th;\n    const put=u=>{el.innerHTML='\u003cimg alt=\"\" src=\"'+u+'\">'};\n    if(urls.has(id))return put(urls.get(id));\n    imgGet(id).then(b=>{if(b){const u=URL.createObjectURL(b);urls.set(id,u);put(u)}});\n  });\n}\n\n// ======================= AI (Gemini gratis / Claude) =======================\nconst PROMPT_FOOD='Kamu ahli gizi yang membantu orang Indonesia mencatat makanan. Lihat foto makanan/minuman ini dan perkirakan kalorinya untuk porsi yang terlihat. Balas HANYA JSON valid tanpa teks lain, dengan bentuk: {\"name\":\"nama makanan singkat dalam Bahasa Indonesia\",\"items\":[{\"name\":\"komponen\",\"portion\":\"perkiraan porsi, mis. 1 piring / 150 g\",\"kcal\":angka bulat}],\"kcal\":total angka bulat,\"confidence\":angka 0-100 seberapa yakin kamu,\"note\":\"catatan singkat, boleh kosong\"}. Jika tidak ada makanan di foto balas {\"name\":\"\",\"items\":[],\"kcal\":0,\"confidence\":0,\"note\":\"tidak ada makanan di foto\"}.';\nfunction aiErr(status,msg){\n  if(status===503||/high demand|overloaded|unavailable/i.test(msg))return \"AI Google lagi penuh (sementara). Coba lagi sebentar lagi.\";\n  if(status===429||/quota|rate/i.test(msg))return \"Batas pemakaian gratis lagi habis. Tunggu beberapa menit lalu coba lagi.\";\n  if(status===400&&/api key/i.test(msg))return \"API key tidak valid. Cek lagi key-nya.\";\n  if(status===403)return \"Key ini tidak punya akses ke Gemini API.\";\n  if(status===404||/no longer available|deprecated/i.test(msg))return \"Model AI itu sudah dihentikan Google. Kosongkan kolom Nama model di ⚙️ supaya dipilih otomatis.\";\n  return msg;\n}\n// Nama model Gemini sering berganti, jadi daftar model terbaru diambil langsung dari Google (disimpan 6 jam).\nasync function geminiModels(force){\n  const first=cfg.model?[cfg.model]:[];\n  try{const c=JSON.parse(localStorage.getItem(\"fd_models\")||\"null\");if(!force&&c&&c.k===String(cfg.key).slice(-6)&&Date.now()-c.t\u003c6*36e5&&c.l.length)return [...new Set([...first,...c.l])]}catch(e){}\n  try{\n    const r=await fetch(\"https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key=\"+encodeURIComponent(cfg.key));\n    const j=await r.json().catch(()=>({}));\n    if(r.ok&&Array.isArray(j.models)){\n      const ok=j.models.filter(m=>(m.supportedGenerationMethods||[]).includes(\"generateContent\")&&/flash/i.test(m.name)&&!/image|live|tts|audio|embed|thinking|robotics|computer|native|exp/i.test(m.name));\n      const sc=m=>{const n=m.name.replace(\"models/\",\"\"),v=parseFloat((n.match(/gemini-(\\d+(?:\\.\\d+)?)/)||[])[1])||0;return (/latest/.test(n)?1000:v*10)-(/lite/.test(n)?3:0)-(/preview/.test(n)?1:0)};\n      const l=ok.sort((a,b)=>sc(b)-sc(a)).map(m=>m.name.replace(\"models/\",\"\")).slice(0,5);\n      if(l.length){try{localStorage.setItem(\"fd_models\",JSON.stringify({t:Date.now(),k:String(cfg.key).slice(-6),l}))}catch(e){}return [...new Set([...first,...l])]}\n    }\n  }catch(e){}\n  return [...new Set([...first,\"gemini-flash-latest\",\"gemini-2.5-flash\",\"gemini-2.5-flash-lite\"])];\n}\nasync function callAI(o){\n  if(!cfg.key)throw new Error(\"NOKEY\");\n  if(cfg.provider===\"claude\"){\n    const content=[];if(o.b64)content.push({type:\"image\",source:{type:\"base64\",media_type:\"image/jpeg\",data:o.b64}});content.push({type:\"text\",text:o.text});\n    const r=await fetch(\"https://api.anthropic.com/v1/messages\",{method:\"POST\",headers:{\"content-type\":\"application/json\",\"x-api-key\":cfg.key,\"anthropic-version\":\"2023-06-01\",\"anthropic-dangerous-direct-browser-access\":\"true\"},body:JSON.stringify({model:cfg.model||\"claude-haiku-5-5\",max_tokens:900,messages:[{role:\"user\",content}]})});\n    const j=await r.json().catch(()=>({}));\n    if(!r.ok)throw new Error((j.error&&j.error.message)||(\"Claude error \"+r.status));\n    return (j.content||[]).map(p=>p.text||\"\").join(\"\");\n  }\n  const parts=[{text:o.text}];if(o.b64)parts.push({inlineData:{mimeType:\"image/jpeg\",data:o.b64}});\n  const gen={temperature:0.2,maxOutputTokens:2048};if(o.json)gen.responseMimeType=\"application/json\";\n  let models=await geminiModels(false),last=null,gone=false;\n  for(let round=0;round\u003c2;round++){\n    for(const m of models){\n      let r,j;\n      try{\n        r=await fetch(\"https://generativelanguage.googleapis.com/v1beta/models/\"+m+\":generateContent?key=\"+encodeURIComponent(cfg.key),{method:\"POST\",headers:{\"content-type\":\"application/json\"},body:JSON.stringify({contents:[{parts}],generationConfig:gen})});\n        j=await r.json().catch(()=>({}));\n      }catch(e){last=new Error(\"Tidak bisa terhubung ke internet\");continue}\n      if(r.ok){\n        const t=((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||\"\").join(\"\");\n        if(!t)throw new Error(j.promptFeedback&&j.promptFeedback.blockReason?\"Diblokir: \"+j.promptFeedback.blockReason:\"Jawaban AI kosong\");\n        return t;\n      }\n      const msg=(j.error&&j.error.message)||(\"Gemini error \"+r.status);\n      last=new Error(aiErr(r.status,msg));\n      const retired=r.status===404||/no longer available|not found|not supported|deprecated/i.test(msg);\n      if(retired)gone=true;\n      // Google kadang menyebut model pengganti di pesan errornya: coba juga yang itu\n      const hint=(msg.match(/use (?:models\\/)?(gemini[a-z0-9.\\-]*)/i)||[])[1];\n      if(hint&&!models.includes(hint))models.push(hint);\n      // penuh / kena batas / model sudah pensiun -> coba model lain, bukan langsung menyerah\n      if(!(retired||r.status===503||r.status===500||r.status===429||/high demand|overloaded|unavailable/i.test(msg)))throw last;\n    }\n    if(round===0){await new Promise(ok=>setTimeout(ok,1800));if(gone)models=await geminiModels(true)}\n  }\n  throw last||new Error(\"Model AI tidak tersedia\");\n}\nfunction parseFood(txt){\n  const m=String(txt).match(/\\{[\\s\\S]*\\}/);if(!m)throw new Error(\"Jawaban AI tidak bisa dibaca\");\n  const j=JSON.parse(m[0]),items=(Array.isArray(j.items)?j.items:[]).map(i=>({name:String(i.name||\"\"),portion:String(i.portion||\"\"),kcal:Math.round(+i.kcal||0)}));\n  let kcal=Math.round(+j.kcal||0);if(!kcal)kcal=items.reduce((s,i)=>s+i.kcal,0);\n  return {name:String(j.name||\"\").trim(),items,kcal,conf:Math.max(0,Math.min(100,Math.round(+j.confidence||0))),note:String(j.note||\"\").trim()};\n}\n\n// ======================= alur foto =======================\nconst newId=()=>Date.now()*1000+Math.floor(Math.random()*1000);\nasync function addPhoto(file){\n  const lm=file.lastModified,t=lm&&Math.abs(Date.now()-lm)\u003c5*365*864e5?lm:Date.now();\n  const e={id:newId(),t,date:iso(new Date(t)),slot:slotOf(t),slotAuto:true,name:\"\",kcal:0,conf:0,items:[],note:\"\",st:\"pending\",u:Date.now()};\n  food.entries.push(e);day=e.date;render();\n  let sh;\n  try{sh=await shrink(file)}catch(err){e.st=\"err\";e.note=\"Foto tidak bisa dibaca\";e.u=Date.now();save();render();return}\n  await imgPut(e.id,sh.blob);fillThumbs();\n  await runAI(e,sh.b64);\n}\nasync function runAI(e,b64){\n  e.st=\"pending\";render();\n  try{\n    const r=parseFood(await callAI({text:PROMPT_FOOD,b64,json:true}));\n    e.name=r.name||\"\";e.items=r.items;e.kcal=r.kcal;e.conf=r.conf;e.note=r.note;e.st=r.name?\"ok\":\"err\";\n    if(!r.name)e.note=r.note||\"Makanan tidak terdeteksi\";\n  }catch(err){\n    if(err.message===\"NOKEY\"){e.st=\"nokey\";e.note=\"Belum ada API key AI\"}\n    else{e.st=\"err\";e.note=String(err.message||err).slice(0,140)}\n  }\n  e.u=Date.now();save();render();\n  if(e.st===\"ok\")autoSummary(e.date);\n  if(e.st===\"nokey\")openSettings(\"Masukkan API key dulu ya, supaya AI bisa membaca fotonya.\");\n}\nasync function retry(e){const b=await imgGet(e.id);if(!b){toast(\"Foto tidak ada di perangkat ini, isi manual saja\");return}runAI(e,await blobB64(b))}\nfunction dayEntries(d){return food.entries.filter(e=>e.date===d).sort((a,b)=>a.t-b.t)}\nfunction localSummary(d){\n  const es=dayEntries(d).filter(e=>e.name);if(!es.length)return \"\";\n  const tot=es.reduce((s,e)=>s+(+e.kcal||0),0);\n  const parts=SLOTS.map(([k,,n])=>{const x=es.filter(e=>e.slot===k);return x.length?n+\": \"+x.map(e=>e.name).join(\", \"):\"\"}).filter(Boolean);\n  return \"Hari ini kamu makan — \"+parts.join(\" • \")+\". Total sekitar \"+dot(tot)+\" kkal\"+(food.goal?\" dari target \"+dot(food.goal)+\" kkal.\":\".\");\n}\nasync function autoSummary(d,force){\n  const cur=food.sums[d];if(cur&&cur.auto===false&&!force)return;\n  const es=dayEntries(d).filter(e=>e.st!==\"pending\"&&e.name);if(!es.length)return;\n  const tot=es.reduce((s,e)=>s+(+e.kcal||0),0);\n  const lines=es.map(e=>slotName(e.slot)+\" \"+hhmm(e.t)+\": \"+e.name+\" (\"+e.kcal+\" kkal)\").join(\"\\n\");\n  const text=\"Kamu teman yang peduli gizi. Catatan makan tanggal \"+d+\":\\n\"+lines+\"\\nTotal \"+tot+\" kkal\"+(food.goal?\", target harian \"+food.goal+\" kkal\":\"\")+\".\\nTulis ringkasan santai dalam Bahasa Indonesia, 2-4 kalimat: sebutkan apa saja yang dimakan hari ini, bandingkan total dengan target, dan beri 1 saran ringan. Jangan menghakimi dan jangan pakai markdown.\";\n  sumBusy=true;render();\n  try{const t=await callAI({text,json:false});food.sums[d]={text:t.trim(),auto:true,u:Date.now()};save()}catch(err){if(force)toast(\"Ringkasan gagal: \"+String(err.message).slice(0,80))}\n  sumBusy=false;render();\n}\n\n// ======================= tampilan =======================\nfunction render(){\n  const es=dayEntries(day),tot=es.reduce((s,e)=>s+(+e.kcal||0),0),goal=+food.goal||0,pc=goal?tot/goal:0;\n  $(\"dTitle\").textContent=new Date(day+\"T00:00:00\").toLocaleDateString(\"id-ID\",{weekday:\"long\",day:\"numeric\",month:\"long\"});\n  $(\"dToday\").classList.toggle(\"hide\",day===iso(new Date()));\n  $(\"kTot\").textContent=dot(tot);$(\"kGoal\").textContent=goal?\" / \"+dot(goal)+\" kkal\":\" kkal\";\n  const b=$(\"kBar\");b.style.width=Math.min(pc,1)*100+\"%\";b.className=pc>1.2?\"over\":pc>1?\"warn\":\"\";\n  $(\"kChips\").innerHTML=SLOTS.map(([k,ic,n])=>'\u003cspan>'+ic+\" \"+n+\" \"+dot(es.filter(e=>e.slot===k).reduce((s,e)=>s+(+e.kcal||0),0))+'\u003c/span>').join(\"\");\n  const s=food.sums[day],box=$(\"aiBox\");\n  if(aiEditing){\n    box.className=\"ai\";box.innerHTML='\u003ctextarea id=\"aiTa\">'+esc(s?s.text:localSummary(day))+'\u003c/textarea>';\n    $(\"aiEdit\").textContent=\"💾 Simpan\";\n  }else{\n    $(\"aiEdit\").textContent=\"✏️ Edit\";\n    const t=s?s.text:localSummary(day);\n    box.className=\"ai\"+(s?\"\":\" dim\");\n    box.textContent=sumBusy?\"⏳ AI lagi menulis ringkasan...\":(t||\"Belum ada makanan. Foto makananmu dulu ya 📷\");\n  }\n  $(\"aiRe\").classList.toggle(\"hide\",!es.some(e=>e.name));\n  $(\"slots\").innerHTML=SLOTS.map(([k,ic,n])=>{\n    const x=es.filter(e=>e.slot===k),sub=x.reduce((a,e)=>a+(+e.kcal||0),0);\n    return '\u003cdiv class=\"sl\">\u003cdiv class=\"sh\">\u003cspan>'+ic+\" \"+n+'\u003c/span>\u003cspan>'+(x.length?dot(sub)+\" kkal\":\"\")+'\u003c/span>\u003c/div>'+(x.length?x.map(entHTML).join(\"\"):'\u003cdiv class=\"empty\">Belum ada\u003c/div>')+'\u003c/div>';\n  }).join(\"\");\n  document.querySelectorAll(\".ent\").forEach(el=>el.onclick=()=>openEntry(+el.dataset.id));\n  fillThumbs();\n}\nfunction entHTML(e){\n  const chip=e.st===\"ok\"?'\u003cspan class=\"cf '+(e.conf>=75?\"c-hi\":e.conf>=50?\"c-mid\":\"c-lo\")+'\">Yakin '+e.conf+'%\u003c/span>':e.st===\"manual\"?'\u003cspan class=\"cf c-man\">Manual ✍️\u003c/span>':\"\";\n  const name=e.st===\"pending\"?\"Menganalisis foto...\":(e.name||(e.st===\"nokey\"?\"Belum dibaca (butuh API key)\":e.st===\"err\"?\"Belum terbaca — tap untuk coba lagi\":\"(tanpa nama)\"));\n  const items=(e.items&&e.items.length)?'\u003csmall class=\"it\">'+e.items.map(i=>esc(i.name)+(i.kcal?\" \"+dot(i.kcal):\"\")).join(\" · \")+'\u003c/small>':\"\";\n  return '\u003cdiv class=\"ent\" data-id=\"'+e.id+'\">\u003cdiv class=\"th\" data-th=\"'+e.id+'\">🍽️\u003c/div>\u003cdiv class=\"tx\">\u003cb>'+esc(name)+'\u003c/b>\u003csmall>'+hhmm(e.t)+chip+'\u003c/small>'+items+'\u003c/div>\u003cdiv class=\"kc\">'+(e.st===\"pending\"?\"⏳\":dot(e.kcal)+\"\u003csmall>kkal\u003c/small>\")+'\u003c/div>\u003c/div>';\n}\nfunction closeSheet(){$(\"ovl\").classList.add(\"hide\")}\n$(\"ovl\").onclick=ev=>{if(ev.target===$(\"ovl\"))closeSheet()};\nfunction openEntry(id,manual){\n  let e=id?food.entries.find(x=>x.id===id):null;\n  if(id&&!e)return;\n  const t=e?e.t:Date.now(),slotSel=e?(e.slotAuto?\"auto\":e.slot):\"auto\";\n  $(\"sheet\").innerHTML='\u003ch3>'+(e?\"Edit makanan\":\"Tambah manual\")+'\u003c/h3>'\n  +(e?'\u003cdiv class=\"th\" data-th=\"'+e.id+'\" style=\"width:100%;height:150px;margin-bottom:6px\">🍽️\u003c/div>':\"\")\n  +'\u003clabel class=\"lb\">Nama makanan\u003c/label>\u003cinput id=\"eN\" type=\"text\" value=\"'+esc(e?e.name:\"\")+'\" placeholder=\"mis. Nasi goreng telur\">'\n  +'\u003cdiv class=\"row2\">\u003cdiv>\u003clabel class=\"lb\">Kalori (kkal)\u003c/label>\u003cinput id=\"eK\" type=\"text\" inputmode=\"numeric\" value=\"'+(e?dot(e.kcal):\"\")+'\" placeholder=\"mis. 450\">\u003c/div>'\n  +'\u003cdiv>\u003clabel class=\"lb\">Waktu makan\u003c/label>\u003cselect id=\"eS\">\u003coption value=\"auto\">Otomatis dari jam\u003c/option>'+SLOTS.map(s=>'\u003coption value=\"'+s[0]+'\">'+s[2]+'\u003c/option>').join(\"\")+'\u003c/select>\u003c/div>\u003c/div>'\n  +'\u003cdiv class=\"row2\">\u003cdiv>\u003clabel class=\"lb\">Tanggal\u003c/label>\u003cinput id=\"eD\" type=\"date\" value=\"'+iso(new Date(t))+'\">\u003c/div>\u003cdiv>\u003clabel class=\"lb\">Jam\u003c/label>\u003cinput id=\"eT\" type=\"time\" value=\"'+hhmm(t)+'\">\u003c/div>\u003c/div>'\n  +'\u003clabel class=\"lb\">Catatan\u003c/label>\u003cinput id=\"eC\" type=\"text\" value=\"'+esc(e?e.note:\"\")+'\" placeholder=\"opsional\">'\n  +(e&&e.conf?'\u003cdiv class=\"hint\" style=\"margin-top:6px\">AI yakin '+e.conf+'% dengan tebakan ini. Angka kalori bisa kamu ubah.\u003c/div>':\"\")\n  +'\u003cbutton class=\"btn\" id=\"eOk\">Simpan\u003c/button>'\n  +(e?'\u003cbutton class=\"btn s\" id=\"eRe\">🔄 Analisis ulang dengan AI\u003c/button>\u003cbutton class=\"btn d\" id=\"eDel\">🗑️ Hapus\u003c/button>':\"\")\n  +'\u003cbutton class=\"btn s\" id=\"eX\">Batal\u003c/button>';\n  $(\"eS\").value=slotSel;bindMoney($(\"eK\"));\n  $(\"ovl\").classList.remove(\"hide\");fillThumbs();\n  $(\"eX\").onclick=closeSheet;\n  $(\"eOk\").onclick=()=>{\n    const name=$(\"eN\").value.trim();if(!name){$(\"eN\").focus();return}\n    const d=$(\"eD\").value||iso(new Date()),tm=$(\"eT\").value||\"12:00\",ts=new Date(d+\"T\"+tm+\":00\").getTime();\n    const auto=$(\"eS\").value===\"auto\",rec={t:ts,date:iso(new Date(ts)),slot:auto?slotOf(ts):$(\"eS\").value,slotAuto:auto,name,kcal:num($(\"eK\").value),note:$(\"eC\").value.trim(),u:Date.now()};\n    if(e){Object.assign(e,rec);if(e.st===\"err\"||e.st===\"nokey\"||e.st===\"pending\")e.st=\"manual\"}\n    else{food.entries.push(Object.assign({id:newId(),items:[],conf:0,st:\"manual\"},rec))}\n    day=rec.date;save();closeSheet();render();toast(\"Tersimpan ✓\");\n  };\n  if(e){\n    $(\"eRe\").onclick=()=>{closeSheet();retry(e)};\n    $(\"eDel\").onclick=()=>{if(!confirm(\"Hapus catatan ini?\"))return;food.deleted.push(e.id);food.entries=food.entries.filter(x=>x.id!==e.id);imgDel(e.id);urls.delete(e.id);save();closeSheet();render()};\n  }\n}\nfunction bindMoney(el){el.addEventListener(\"input\",()=>{const n=num(el.value);el.value=n?dot(n):\"\"})}\nfunction openSettings(msg){\n  $(\"sheet\").innerHTML='\u003ch3>⚙️ Pengaturan\u003c/h3>'+(msg?'\u003cdiv class=\"hint\" style=\"color:#d9647d;font-weight:800;margin-bottom:6px\">'+esc(msg)+'\u003c/div>':\"\")\n  +'\u003clabel class=\"lb\">AI yang membaca foto\u003c/label>\u003cselect id=\"sP\">\u003coption value=\"gemini\">Gemini (gratis)\u003c/option>\u003coption value=\"claude\">Claude (berbayar)\u003c/option>\u003c/select>'\n  +'\u003clabel class=\"lb\">API key\u003c/label>\u003cinput id=\"sK\" type=\"password\" autocomplete=\"off\" autocapitalize=\"off\" placeholder=\"tempel API key di sini\" value=\"'+esc(cfg.key)+'\">'\n  +'\u003cdiv class=\"hint\" id=\"sH\">\u003c/div>'\n  +'\u003clabel class=\"lb\">Nama model (boleh kosong)\u003c/label>\u003cinput id=\"sM\" type=\"text\" autocapitalize=\"off\" value=\"'+esc(cfg.model)+'\" placeholder=\"otomatis\">'\n  +'\u003clabel class=\"lb\">Target kalori per hari\u003c/label>\u003cinput id=\"sG\" type=\"text\" inputmode=\"numeric\" value=\"'+dot(food.goal)+'\">'\n  +'\u003cdiv class=\"hint\" id=\"sT\" style=\"margin-top:8px\">\u003c/div>'\n  +'\u003cbutton class=\"btn\" id=\"sOk\">Simpan\u003c/button>\u003cbutton class=\"btn s\" id=\"sTest\">Tes koneksi AI\u003c/button>\u003cbutton class=\"btn s\" id=\"sX\">Tutup\u003c/button>'\n  +'\u003cdiv class=\"hint\" style=\"margin-top:8px\">Key disimpan di akun Google-mu (hanya kamu yang bisa membuka), jadi perangkat lain ikut memakainya otomatis setelah login.\u003c/div>';\n  $(\"sP\").value=cfg.provider;bindMoney($(\"sG\"));\n  const hint=()=>{$(\"sH\").innerHTML=$(\"sP\").value===\"claude\"?'Buat key di \u003cb>console.anthropic.com\u003c/b> (perlu saldo/billing).':'Gratis: buka \u003cb>aistudio.google.com/apikey\u003c/b> → Create API key → salin lalu tempel di sini.'};\n  hint();$(\"sP\").onchange=hint;\n  $(\"ovl\").classList.remove(\"hide\");\n  const read=()=>({provider:$(\"sP\").value,key:$(\"sK\").value.trim(),model:$(\"sM\").value.trim()});\n  $(\"sX\").onclick=closeSheet;\n  $(\"sOk\").onclick=()=>{cfg=Object.assign(read(),{ku:Date.now()});food.goal=num($(\"sG\").value)||1800;food.gu=Date.now();save();closeSheet();render();toast(\"Pengaturan tersimpan ✓\")};\n  $(\"sTest\").onclick=async()=>{\n    const old=cfg;cfg=Object.assign({},old,read());$(\"sT\").textContent=\"⏳ menghubungi AI...\";\n    try{const t=await callAI({text:\"Balas hanya dengan satu kata: OK\",json:false});$(\"sT\").textContent=\"✅ Tersambung. Balasan AI: \"+t.trim().slice(0,40)}\n    catch(err){$(\"sT\").textContent=\"⚠️ \"+(err.message===\"NOKEY\"?\"Isi API key dulu\":String(err.message).slice(0,160))}\n    cfg=old;\n  };\n}\n\n// ======================= sinkron (Firebase, satu dokumen dengan Kantong Laut) =======================\nlet syncing=false,tmr=null;\nconst pub=()=>({v:1,entries:food.entries.filter(e=>e.st!==\"pending\"),sums:food.sums,deleted:[...new Set(food.deleted)],goal:food.goal,gu:food.gu});\nconst canon=o=>JSON.stringify({e:[...(o.entries||[])].sort((a,b)=>a.id-b.id),s:Object.fromEntries(Object.entries(o.sums||{}).sort()),x:[...new Set(o.deleted||[])].sort(),g:o.goal,gu:o.gu||0});\nfunction mergeFood(r){\n  const del=new Set([...(food.deleted||[]),...(r.deleted||[])]),m=new Map();\n  [...(r.entries||[]),...food.entries].forEach(e=>{if(del.has(e.id))return;const o=m.get(e.id);if(!o||(e.u||0)>=(o.u||0))m.set(e.id,e)});\n  food.entries=[...m.values()];food.deleted=[...del];\n  Object.keys(r.sums||{}).forEach(d=>{const a=food.sums[d],b=r.sums[d];if(!a||(b.u||0)>(a.u||0))food.sums[d]=b});\n  if((r.gu||0)>(food.gu||0)){food.goal=r.goal;food.gu=r.gu}\n}\nfunction st(t){lastSt=t||\"\";uiAuth()}\nfunction uiAuth(){\n  const ready=!!window.firebase&&!!auth;\n  $(\"cs\").textContent=user?((user.email||\"Tersambung\")+\" · \"+(lastSt||\"tersambung\")):\"Foto makananmu, AI yang menghitung kalorinya.\";\n  const show=authReady&&ready&&!user;\n  $(\"cloud\").classList.toggle(\"hide\",!show);\n  $(\"cloudtxt\").textContent=\"☁️ Belum masuk, jadi catatan makan cuma ada di perangkat ini. Masuk supaya semua perangkat terhubung.\";\n}\nfunction schedSync(){if(!user)return;clearTimeout(tmr);tmr=setTimeout(sync,1500)}\nasync function sync(){\n  if(!user||!db||syncing)return;syncing=true;st(\"⏳ sinkron...\");\n  try{\n    const ref=db.collection(\"users\").doc(user.uid),sig=()=>canon(pub())+\"|\"+cfg.ku+\"|\"+cfg.key,before=sig();\n    await db.runTransaction(async tx=>{\n      const snap=await tx.get(ref),d=snap.exists?snap.data():{};\n      const rf=d.food?JSON.parse(d.food):null,rk=d.aikey?JSON.parse(d.aikey):null;\n      if(rf)mergeFood(rf);\n      const upd={};\n      if(!rf||canon(rf)!==canon(pub()))upd.food=JSON.stringify(pub());\n      if(rk&&(rk.ku||0)>(cfg.ku||0))cfg={provider:rk.p,key:rk.k,model:rk.m||\"\",ku:rk.ku};\n      else if(cfg.key&&(!rk||(cfg.ku||0)>(rk.ku||0)))upd.aikey=JSON.stringify({p:cfg.provider,k:cfg.key,m:cfg.model,ku:cfg.ku||Date.now()});\n      if(Object.keys(upd).length)tx.set(ref,upd,{merge:true});\n    });\n    saveLocal();\n    const changed=before!==sig();\n    st(\"☁️ tersinkron \"+new Date().toLocaleTimeString(\"id-ID\",{hour:\"2-digit\",minute:\"2-digit\"}));\n    if(changed)render();\n  }catch(e){st(\"⚠️ \"+(e.code===\"permission-denied\"?\"aturan Firestore belum benar\":(e.message||\"gagal sync\")))}\n  syncing=false;\n}\nasync function doLogin(){\n  if(!auth)return;\n  const pr=new firebase.auth.GoogleAuthProvider();\n  try{await auth.signInWithPopup(pr)}\n  catch(e){\n    if(e.code===\"auth/popup-blocked\"||e.code===\"auth/operation-not-supported-in-this-environment\"){try{await auth.signInWithRedirect(pr)}catch(e2){alert(e2.message)}}\n    else if(e.code!==\"auth/popup-closed-by-user\"&&e.code!==\"auth/cancelled-popup-request\")alert(e.code===\"auth/unauthorized-domain\"?\"Domain ini belum diizinkan di Firebase (Authentication → Settings → Authorized domains)\":e.message);\n  }\n}\nfunction fbInit(){\n  try{\n    if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);\n    auth=firebase.auth();db=firebase.firestore();\n    auth.onAuthStateChanged(u=>{user=u;authReady=true;uiAuth();if(u)sync()});\n    auth.getRedirectResult().catch(()=>{});\n  }catch(e){st(\"⚠️ \"+e.message)}\n}\nfunction loadFb(){\n  const base=\"https://www.gstatic.com/firebasejs/10.12.2/\";\n  const add=f=>new Promise((ok,no)=>{const sc=document.createElement(\"script\");sc.src=base+f;sc.onload=ok;sc.onerror=()=>no(new Error(f));document.head.appendChild(sc)});\n  add(\"firebase-app-compat.js\").then(()=>Promise.all([add(\"firebase-auth-compat.js\"),add(\"firebase-firestore-compat.js\")])).then(fbInit).catch(()=>{});\n}\n\n// ======================= tombol =======================\n$(\"prev\").onclick=()=>{const d=new Date(day+\"T00:00:00\");d.setDate(d.getDate()-1);day=iso(d);aiEditing=false;render()};\n$(\"next\").onclick=()=>{const d=new Date(day+\"T00:00:00\");d.setDate(d.getDate()+1);day=iso(d);aiEditing=false;render()};\n$(\"dToday\").onclick=()=>{day=iso(new Date());aiEditing=false;render()};\n$(\"gear\").onclick=()=>openSettings();\n$(\"bCam\").onclick=()=>$(\"fCam\").click();\n$(\"bGal\").onclick=()=>$(\"fGal\").click();\n$(\"bMan\").onclick=()=>openEntry(null,true);\n$(\"fCam\").onchange=async ev=>{const f=ev.target.files[0];ev.target.value=\"\";if(f)await addPhoto(f)};\n$(\"fGal\").onchange=async ev=>{const fs=[...ev.target.files].sort((a,b)=>a.lastModified-b.lastModified);ev.target.value=\"\";for(const f of fs)await addPhoto(f)};\n$(\"aiEdit\").onclick=()=>{\n  if(aiEditing){const v=$(\"aiTa\").value.trim();if(v)food.sums[day]={text:v,auto:false,u:Date.now()};else delete food.sums[day];aiEditing=false;save();render();toast(\"Ringkasan tersimpan ✓\")}\n  else{aiEditing=true;render()}\n};\n$(\"aiRe\").onclick=()=>{aiEditing=false;autoSummary(day,true)};\n$(\"cloudbtn\").onclick=doLogin;\ndocument.addEventListener(\"visibilitychange\",()=>{if(!document.hidden)sync()});\nwindow.addEventListener(\"online\",()=>sync());\nrender();uiAuth();\nif(window.firebase)fbInit();else loadFb();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}
  ];
  let want="";
  try{want=new URLSearchParams(location.search).get("app")||localStorage.getItem("menu_last")||""}catch(e){}
  const app=APPS.find(a=>a.id===want)||APPS[0];
  try{localStorage.setItem("menu_last",app.id)}catch(e){}

  function mount(){
    const host=document.createElement("div");
    host.id="menu-host";
    host.style.cssText="display:block;position:relative;z-index:2147483000";
    const r=host.attachShadow({mode:"open"});
    r.innerHTML='<style>'
      +'.b{padding:8px 10px;background:'+app.bar+';box-shadow:0 3px 12px rgba(0,0,0,.08)}'
      +'select{display:block;width:100%;height:42px;border:0;border-radius:15px;padding:0 38px 0 14px;font:800 16px Nunito,"Trebuchet MS",system-ui,sans-serif;color:#3d5f73;-webkit-appearance:none;appearance:none;'
      +'background:#ffffffe6 url("data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'14\' height=\'9\' viewBox=\'0 0 14 9\'><path d=\'M1 1l6 6 6-6\' fill=\'none\' stroke=\'%233d5f73\' stroke-width=\'2\' stroke-linecap=\'round\' stroke-linejoin=\'round\'/></svg>") no-repeat right 14px center}'
      +'</style><div class="b"><select aria-label="Pilih halaman">'
      +APPS.map(a=>'<option value="'+a.id+'"'+(a.id===app.id?' selected':'')+'>'+a.icon+'  '+a.name+'</option>').join("")
      +'</select></div>';
    r.querySelector("select").onchange=e=>{location.href=location.pathname+"?app="+e.target.value};
    document.body.insertBefore(host,document.body.firstChild);

    // identitas di home screen
    document.title="Rara Apps";
    const hd=document.head;
    let m=hd.querySelector('meta[name="apple-mobile-web-app-title"]');
    if(!m){m=document.createElement("meta");m.name="apple-mobile-web-app-title";hd.appendChild(m)}
    m.content="Rara Apps";
    ["apple-mobile-web-app-capable","mobile-web-app-capable"].forEach(n=>{
      if(!hd.querySelector('meta[name="'+n+'"]')){const x=document.createElement("meta");x.name=n;x.content="yes";hd.appendChild(x)}
    });
    hd.querySelectorAll('link[rel="apple-touch-icon"]').forEach(l=>l.remove());
    try{
      const c=document.createElement("canvas");c.width=c.height=180;const x=c.getContext("2d");
      const g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,"#f9a8d4");g.addColorStop(1,"#8ccbe6");
      x.fillStyle=g;x.fillRect(0,0,180,180);x.font="100px serif";x.textAlign="center";x.textBaseline="middle";x.fillText("🌈",90,98);
      const l=document.createElement("link");l.rel="apple-touch-icon";l.href=c.toDataURL("image/png");hd.appendChild(l);
    }catch(e){}
  }
  let booted=false,mounted=false;
  function boot(){
    if(booted)return;booted=true;   // jaga-jaga: jangan sampai jalan dua kali
    document.open();document.write(app.html);document.close();
    const go=()=>{if(mounted)return;mounted=true;try{mount()}catch(e){console.error(e)}};
    if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",go);else go();
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
